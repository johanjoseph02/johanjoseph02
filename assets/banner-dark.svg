<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t">
  <title id="t">Johan Mathew Joseph</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="g0"><stop offset="0" stop-color="#3b6cff" stop-opacity="0.42"/><stop offset="1" stop-color="#3b6cff" stop-opacity="0"/></radialGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#14b8a6" stop-opacity="0.26"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="spot"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.3" fill="#e6edf3"/>
    </pattern>
    <mask id="sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="300">
      <ellipse class="spot" cx="0" cy="150.0" rx="230" ry="190" fill="url(#spot)"/>
    </mask>
    <clipPath id="card"><rect width="1280" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .a { animation: drift 18s ease-in-out infinite alternate; }
    .b { animation: drift2 22s ease-in-out infinite alternate; }
    .c { animation: drift 26s ease-in-out infinite alternate-reverse; }
    @keyframes drift { to { transform: translate(140px, 30px); } }
    @keyframes drift2 { to { transform: translate(-160px, -24px); } }
    .spot { animation: sweep 9s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(1540px); } }
    .in { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .25s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) {
      .a, .b, .c, .in { animation: none; }
      .spot { animation: none; transform: translateX(640.0px); }
    }
  </style>
  <g clip-path="url(#card)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <ellipse class="a" cx="300" cy="80" rx="420" ry="230" fill="url(#g0)"/>
    <ellipse class="b" cx="980" cy="230" rx="440" ry="240" fill="url(#g1)"/>
    <ellipse class="c" cx="660" cy="320" rx="380" ry="200" fill="url(#g2)"/>
    <rect width="1280" height="300" fill="url(#dots)" opacity="0.07"/>
    <rect width="1280" height="300" fill="url(#dots)" opacity="0.55" mask="url(#sweep)"/>
    <text class="in" x="640.0" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1" fill="#f4f6fb">Johan Mathew Joseph</text>
    <text class="in d1" x="640.0" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="3" fill="#8b949e">BANGALORE, INDIA</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="299" rx="18" fill="none" stroke="#30363d"/>
</svg>
